name: ci-test

on: [push, pull_request]

jobs:
  clj-test:
    # ubuntu 24.04 comes with lein + java8 installed
    runs-on: ubuntu-24.04
    steps:
      - name: Git checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Install bb
        run:
          ./bin/install-bb.sh

      - name: Install clojure tools
        uses: DeLaGuardo/setup-clojure@13.4
        with:
          cli: 1.12.1.1550

      - name: Run CLJ Tests
        run: |
          bb test clj

  cljs-test:
    runs-on: ubuntu-24.04
    steps:
      - name: Git checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Install bb
        run:
          ./bin/install-bb.sh

      - name: Install clojure tools
        uses: DeLaGuardo/setup-clojure@13.4
        with:
          cli: 1.12.1.1550

      - name: Install Chrome
        run: |
          whoami
          sudo apt-get update -qq
          sudo apt-get install -q -y xvfb libgbm1 libxss1 chromium-browser

      - name: Ensure chrome installed
        run: chromium-browser --version

      - name: Install cljs deps
        run: yarn install

      - name: Run CLJS tests
        run: ./bin/ci-cljs-test.sh
